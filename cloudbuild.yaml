steps:
  # Use kaniko to build AND push in a single step
  # Kaniko reads credentials directly from the GCP metadata server - no Docker daemon or gcloud needed
  - name: 'gcr.io/kaniko-project/executor:v1.23.2-debug'
    args:
      - '--dockerfile=Dockerfile'
      - '--context=dir:///workspace'
      - '--destination=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$_TAG'
      - '--cache=true'
      - '--skip-unused-stages=true'
    timeout: '1200s'
  - name: 'gcr.io/kaniko-project/executor:v1.23.2-debug'
    args:
      - '--dockerfile=Dockerfile'
      - '--context=dir:///workspace'
      - '--target=migrate'
      - '--destination=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$_TAG-migrate'
      - '--cache=true'
    timeout: '1200s'

substitutions:
  _REGION: us-central1
  _REPO_NAME: medicheck
  _SERVICE_NAME: medicheck-web
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY
