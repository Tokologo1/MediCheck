name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # needed for Workload Identity Federation

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: project-fbd1d979-ca47-4901-bbf
  REGION: us-central1
  REPO: medicheck
  SERVICE: medicheck-web
  MIGRATE_JOB: medicheck-migrate
  WIF_PROVIDER: projects/1023992607262/locations/global/workloadIdentityPools/github/providers/github
  DEPLOYER_SA: medicheck-github-deployer@project-fbd1d979-ca47-4901-bbf.iam.gserviceaccount.com

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Authenticate to GCP via Workload Identity Federation ─────────────
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # ── 3. Ensure Cloud Build source bucket exists ───────────────────────────
      - name: Ensure build source bucket
        run: |
          BUCKET="$PROJECT_ID-medicheck-build-source"
          gcloud storage buckets describe "gs://$BUCKET" &>/dev/null 2>&1 || \
          gcloud storage buckets create "gs://$BUCKET" \
            --location="$REGION" \
            --uniform-bucket-level-access \
            --quiet
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REGION: ${{ env.REGION }}

      # ── 4. Build image via Cloud Build (kaniko) ──────────────────────────────
      - name: Build Docker image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$SERVICE:$GITHUB_SHA"
          gcloud builds submit . \
            --config=cloudbuild.yaml \
            --substitutions="_REGION=$REGION,_REPO_NAME=$REPO,_SERVICE_NAME=$SERVICE,_TAG=$GITHUB_SHA" \
            --gcs-source-staging-dir="gs://$PROJECT_ID-medicheck-build-source/source" \
            --quiet
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REGION: ${{ env.REGION }}
          REPO: ${{ env.REPO }}
          SERVICE: ${{ env.SERVICE }}

      # ── 5. Run Prisma migrations ─────────────────────────────────────────────
      - name: Run database migrations
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$SERVICE:$GITHUB_SHA-migrate"
          # Update the migrate job image and execute
          gcloud run jobs update "$MIGRATE_JOB" \
            --image="$IMAGE" \
            --region="$REGION" \
            --quiet 2>/dev/null || true
          gcloud run jobs execute "$MIGRATE_JOB" \
            --region="$REGION" \
            --wait \
            --quiet
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REGION: ${{ env.REGION }}
          REPO: ${{ env.REPO }}
          SERVICE: ${{ env.SERVICE }}
          MIGRATE_JOB: ${{ env.MIGRATE_JOB }}

      # ── 6. Deploy to Cloud Run ───────────────────────────────────────────────
      - name: Deploy to Cloud Run
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$SERVICE:$GITHUB_SHA"
          gcloud run services update "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --update-secrets="\
              DATABASE_URL=medicheck-db-url:latest,\
              JWT_ACCESS_SECRET=medicheck-jwt-access-secret:latest,\
              JWT_REFRESH_SECRET=medicheck-jwt-refresh-secret:latest,\
              STRIPE_SECRET_KEY=medicheck-stripe-secret-key:latest,\
              STRIPE_WEBHOOK_SECRET=medicheck-stripe-webhook-secret:latest,\
              NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=medicheck-stripe-publishable-key:latest" \
            --quiet
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REGION: ${{ env.REGION }}
          SERVICE: ${{ env.SERVICE }}

      # ── 7. Print service URL ────────────────────────────────────────────────
      - name: Get service URL
        run: |
          gcloud run services describe "$SERVICE" \
            --region="$REGION" \
            --format="value(status.url)"
        env:
          SERVICE: ${{ env.SERVICE }}
          REGION: ${{ env.REGION }}
