name: Deploy to Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY || 'medicheck' }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'medicheck-web' }}
  MIGRATION_JOB: ${{ vars.MIGRATION_JOB || 'medicheck-migrate' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build image
        run: >-
          gcloud builds submit . --config=cloudbuild.yaml --project="$GCP_PROJECT_ID"
          --substitutions="_REGION=$GCP_REGION,_REPO_NAME=$ARTIFACT_REPOSITORY,_SERVICE_NAME=$CLOUD_RUN_SERVICE,_TAG=$GITHUB_SHA"
      - name: Run database migrations
        run: >-
          gcloud run jobs update "$MIGRATION_JOB" --image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$CLOUD_RUN_SERVICE:$GITHUB_SHA-migrate"
          --region="$GCP_REGION" --project="$GCP_PROJECT_ID" --quiet &&
          gcloud run jobs execute "$MIGRATION_JOB" --region="$GCP_REGION" --project="$GCP_PROJECT_ID" --wait
      - name: Deploy service
        run: >-
          gcloud run services update "$CLOUD_RUN_SERVICE" --image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$CLOUD_RUN_SERVICE:$GITHUB_SHA"
          --region="$GCP_REGION" --project="$GCP_PROJECT_ID" --quiet
